<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-green: #2ea043;
      --accent-gold: #e3b341;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      width: 1440px;
      box-sizing: border-box;
    }

    .header-liga {
      text-align: center;
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .header-liga h1 {
      margin: 0;
      font-size: 32px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .match-teams {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .direct-pick-high {
      background: rgba(46, 160, 67, 0.15);
      border: 2px solid var(--accent-green);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .direct-pick-high .title {
      color: var(--accent-green);
      font-weight: bold;
      font-size: 18px;
      text-transform: uppercase;
    }

    .direct-pick-high .value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 5px;
    }

    .grid-markets {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .market-group {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 15px;
    }

    .market-title {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .market-value {
      font-size: 16px;
      font-weight: 600;
    }

    .badge-stake {
      background-color: var(--accent-gold);
      color: #000;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="header-liga">
    <h1>🏆 {{ NOMBRE_LIGA }}</h1>
  </div>

  <!-- CONTENIDO DINÁMICO DE PARTIDOS SE INYECTA AQUÍ -->
  {{ CONTENIDO_PARTIDOS }}

</body>
</html>
